name: Secret Scan

# Scans only the commits a PR or push adds (not the whole history) with gitleaks.
# The binary is downloaded from the release and checked against a pinned sha256,
# because gitleaks-action needs a paid licence for organisation repositories.
# To bump gitleaks: change GITLEAKS_VERSION and GITLEAKS_SHA256 together
# (sha256 of gitleaks_<version>_linux_x64.tar.gz from the release checksums.txt).
#
# Call it from a repo like this:
#
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   jobs:
#     secret-scan:
#       uses: EduIDE/.github/.github/workflows/secret-scan.yml@main

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan new commits
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks

          args=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
            # Config and ignore file come from the base commit, so a PR cannot
            # weaken its own scan. Without them gitleaks uses its defaults.
            if git cat-file -e "${PR_BASE}:.gitleaks.toml" 2>/dev/null; then
              git show "${PR_BASE}:.gitleaks.toml" > "$RUNNER_TEMP/gitleaks.toml"
              args+=(--config "$RUNNER_TEMP/gitleaks.toml")
            fi
            if git cat-file -e "${PR_BASE}:.gitleaksignore" 2>/dev/null; then
              git show "${PR_BASE}:.gitleaksignore" > "$RUNNER_TEMP/gitleaksignore"
              args+=(--gitleaks-ignore-path "$RUNNER_TEMP/gitleaksignore")
            fi
          elif [ "$EVENT_NAME" = "push" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            # New branch, force push (old tip unreachable), manual or scheduled
            # run: scan everything not already on the default branch.
            range="origin/${DEFAULT_BRANCH}..${PUSH_AFTER}"
          fi
          echo "Scanning: $range"
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --log-opts="$range" "${args[@]}" .
