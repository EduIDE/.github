name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate-config:
    name: Validate shared Renovate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # renovate-config.json is extended by every repo in the org, so a typo here
      # breaks all of them at once. The version is pinned deliberately: an
      # unpinned `npx renovate` resolves to whatever is in the npx cache, which
      # is how you end up validating against a release that predates the options
      # you are using.
      - name: Validate
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: "44.46.7"
        run: |
          set -euo pipefail
          npx --yes --package "renovate@${RENOVATE_VERSION}" -- \
            renovate-config-validator --strict renovate-config.json

  # Runs the shared hygiene workflow from this checkout, so a change to it is
  # exercised here before any repository picks it up through @v1. It runs
  # actionlint over this repository's workflows too.
  hygiene:
    uses: ./.github/workflows/hygiene.yml

  test:
    name: Tag derivation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Run tests
        run: ./tests/test-derive-tags.sh

  tag-format:
    name: Tag format tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Run tests
        run: ./tests/test-tag-format.sh

  release-checks:
    name: Release check tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Run tests
        run: ./tests/test-release-checks.sh
