name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate-config:
    name: Validate shared Renovate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # renovate-config.json is extended by every repo in the org, so a typo here
      # breaks all of them at once. The version is pinned deliberately: an
      # unpinned `npx renovate` resolves to whatever is in the npx cache, which
      # is how you end up validating against a release that predates the options
      # you are using.
      - name: Validate
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: "44.258.1"
        run: |
          set -euo pipefail
          npx --yes --package "renovate@${RENOVATE_VERSION}" -- \
            renovate-config-validator --strict renovate-config.json

  lint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run actionlint
        run: |
          set -euo pipefail
          tarball=actionlint_1.7.7_linux_amd64.tar.gz
          curl -fsSL -o "$tarball" "https://github.com/rhysd/actionlint/releases/download/v1.7.7/$tarball"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $tarball" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint -color

  test:
    name: Tag derivation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install yq
        run: |
          set -euo pipefail
          wget -qO yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          echo "a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7  yq" | sha256sum -c -
          sudo install -m 755 yq /usr/local/bin/yq
      - name: Run tests
        run: ./tests/test-derive-tags.sh

  tag-format:
    name: Tag format tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install yq
        run: |
          set -euo pipefail
          wget -qO yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          echo "a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7  yq" | sha256sum -c -
          sudo install -m 755 yq /usr/local/bin/yq
      - name: Run tests
        run: ./tests/test-tag-format.sh

  renovate-managers:
    name: Renovate custom manager tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run tests
        run: ./tests/test-renovate-managers.sh

  secret-scan:
    name: Secret scan
    uses: ./.github/workflows/secret-scan.yml
